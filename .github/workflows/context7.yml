name: Update Context7 Docs

# Manual only. The `release: published` trigger this used to carry could never
# fire — the release is created by publish.yml with the default GITHUB_TOKEN,
# and GitHub does not cascade workflow triggers from GITHUB_TOKEN events. Five
# releases produced zero runs from it. Release-time indexing now lives in
# publish.yml, which already has the release context; this remains for
# re-indexing on demand without cutting a release.
on:
  workflow_dispatch:

jobs:
  update-docs:
    runs-on: ubuntu-latest
    # The script's own curl timeouts bound this to a few minutes; the default is 360.
    timeout-minutes: 15
    # This job writes a third-party secret to a curl invocation and needs no git
    # credentials of its own.
    permissions:
      contents: read
    # A second dispatch while one is polling would race two refreshes of the same
    # library.
    concurrency:
      group: context7-refresh
      cancel-in-progress: false
    steps:
      # Needed only because `run:` executes a file from this repo.
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
            context7.json

      - name: Refresh the Context7 docs index
        env:
          CONTEXT7_API_KEY: ${{ secrets.CONTEXT7_API_KEY }}
        # `rennf93/upsert-context7@1.1` is gone from here on purpose. Measured
        # 2026-07-30: its `add` endpoint answers 405, and its `refresh` endpoint is
        # a page route that answers 200 with HTML — which the action reports as
        # success. The script checks the content type and then reads the index's
        # own timestamp back, so neither failure can present as green.
        run: .github/scripts/refresh-context7.sh
