name: Update Context7 Docs

# Manual only. The `release: published` trigger this used to carry could never
# fire — the release is created by publish.yml with the default GITHUB_TOKEN,
# and GitHub does not cascade workflow triggers from GITHUB_TOKEN events. Five
# releases produced zero runs from it. Release-time indexing now lives in
# publish.yml, which already has the release context; this remains for
# re-indexing on demand without cutting a release.
on:
  workflow_dispatch:

jobs:
  update-docs:
    runs-on: ubuntu-latest
    env:
      # rennf93/upsert-context7@1.1 internally uses actions/setup-python@v5 (Node 20)
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v6

      - name: Add/Refresh Context7 Documentation
        id: context7
        uses: rennf93/upsert-context7@1.1
        with:
          operation: refresh

      # Fails on a non-success outcome, for the same reason publish.yml's
      # docs-index job does: this used to print `Success: false` and exit 0, so
      # the remedy for a stale index was itself a green run that changed nothing.
      # Nothing downstream depends on this workflow, so there is no release to
      # protect here — it can simply be red.
      - name: Show result, and fail if it did not succeed
        if: always()
        run: |
          echo "Success: ${{ steps.context7.outputs.success }}"
          echo "Status: ${{ steps.context7.outputs.status-code }}"
          echo "Message: ${{ steps.context7.outputs.message }}"
          if [ "${{ steps.context7.outputs.success }}" != "true" ]; then
            echo "::error title=Context7 refresh failed::The docs index is unchanged. Status: ${{ steps.context7.outputs.status-code }} — a 4xx usually means the upstream API contract moved, so check rennf93/upsert-context7 for a newer version before re-running."
            exit 1
          fi
