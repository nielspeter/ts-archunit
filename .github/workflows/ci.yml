name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test
      - run: npm run build

      # The repo's shell scripts are covered by nothing else: `format:check`'s
      # pathspec list has no `*.sh`, ESLint ignores them, and `typecheck` cannot see
      # them. One of them holds a secret in the release path. shellcheck is
      # preinstalled on ubuntu-latest.
      - run: shellcheck -x .github/scripts/*.sh scripts/*.sh
