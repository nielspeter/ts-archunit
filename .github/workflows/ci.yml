name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test
      - run: npm run build
      # Plan 0083 Phase 3: resolve every `exports` subpath by PACKAGE NAME and assert each
      # target ships. Twelve subpaths existed for months with nothing resolving one — the
      # only tests naming the package treated it as a string. Must run AFTER build.
      - run: node scripts/verify-package.mjs

      # Plan 0095: the vacuity matrix — every published check-constructor run over a corpus of
      # zero subjects, asserting the recorded truth table exactly. Excluded from `npm run test`
      # because it imports `dist`, and the suite above runs before the build; a row that skipped
      # when `dist/` was absent would be a check that cannot fail. Must run AFTER build, for the
      # same reason as verify-package.mjs directly above.
      - run: npx vitest run tests/matrix --exclude '**/node_modules/**'

      # The repo's shell scripts are covered by nothing else: `format:check`'s
      # pathspec list has no `*.sh`, ESLint ignores them, and `typecheck` cannot see
      # them. One of them holds a secret in the release path. shellcheck is
      # preinstalled on ubuntu-latest.
      - run: shellcheck -x .github/scripts/*.sh scripts/*.sh
