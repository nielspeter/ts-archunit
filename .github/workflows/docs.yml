name: Deploy Docs

on:
  push:
    branches: [main]
    paths: ['docs/**', '.github/workflows/docs.yml']
  workflow_dispatch:

# Two pushes to `main` touching `docs/**` in quick succession otherwise race two
# `deploy-pages` calls against one environment. `publish.yml` has carried a concurrency
# group since it was written; this workflow never had one.
#
# `cancel-in-progress: false`, not true: a half-finished Pages deploy is worse than a
# queued one, and the later push's content supersedes the earlier one anyway.
#
# **This is the whole of what bug 0062 gap 4 gets, deliberately.** A version gate was
# built and reverted the same day, and the reasoning is worth keeping because the gap is
# still open and someone will reach for it again:
#
# The measured harm is a 32m54s window on the v0.56.0 release, during which the site
# documented 0.56.0 while npm served 0.55.3. Real, and nothing broke — the harm is a
# reader running new docs against an old install.
#
# The gate cost more than that. It stranded docs deploys on `main` for the entire span
# between a release merge and its tag (unbounded if the tag never comes, and reported as a
# green 14-second run nobody inspects); it treated "npm unreachable" as "not published yet"
# and skipped while reporting green, which is a check that cannot fail inside the fix for a
# check that could not fail; and its release-path half would have been rejected outright by
# the `github-pages` environment, whose deployment policy allows the `main` branch and no
# tags — so the first tag would have published to npm and left the docs stranded on the
# previous version, the inverse of the skew it was built to prevent.
#
# So: a short skew on release day, which is what this project had for its whole life, is
# cheaper than a conditional deploy with three failure modes. If the skew ever does cost
# something real, the honest fix is a scheduled check that `package.json` and `npm latest`
# agree — a detector, not a gate on the path that has never failed.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run docs:build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs/.vitepress/dist
      - uses: actions/deploy-pages@v5
