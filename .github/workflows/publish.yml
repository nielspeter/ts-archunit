name: Publish to npm

on:
  push:
    tags:
      - 'v*'

# One publish at a time, never cancelled: two tags in quick succession with no
# group means `latest` lands on whichever `npm publish` finishes last — and
# plan 0070 ships 0.22.0 and 0.23.0 close together by design.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      # Bug 0062: this was in ci.yml and NOT here, so CI's verdict on the release scripts
      # was concurrent with the publish run and gated nothing. One of them holds a secret
      # in the release path.
      - run: shellcheck -x .github/scripts/*.sh scripts/*.sh
      - run: npm run test
      - run: npm run build
      # Plan 0083 Phase 3: resolve every `exports` subpath by PACKAGE NAME and assert each
      # target ships. Twelve subpaths existed for months with nothing resolving one — the
      # only tests naming the package treated it as a string. Must run AFTER build.
      - run: node scripts/verify-package.mjs

      # Verify the version in package.json matches the tag
      - name: Verify version matches tag
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "Error: package.json version ($PACKAGE_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi

      # Extract the release notes BEFORE publishing, and fail if there are none.
      # npm versions are immutable, so every check that can fail must run on
      # this side of `npm publish`. This step used to sit after it, with a
      # fallback that wrote "No changelog entry for vX.Y.Z." into the release
      # body — turning a missing entry into a silent success on an
      # unrecoverable release. Measured against a CHANGELOG whose top section
      # was still `## [Unreleased]`: the awk matched 0 lines and the fallback
      # fired.
      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES=$(awk "/^## \[${VERSION}\]/{flag=1; next} /^## \[/{flag=0} flag" CHANGELOG.md)
          # Test the VARIABLE, not the file: `echo "$NOTES" > file` writes a
          # 1-byte newline when the section is missing, so `[ ! -s file ]` was
          # false and the gate passed on an empty body — measured in review by
          # dry-running a version with no section. npm publish is immutable;
          # this test must fail closed.
          echo "$NOTES" > /tmp/release-notes.txt
          if [ -z "${NOTES//[[:space:]]/}" ]; then
            echo "Error: CHANGELOG.md has no '## [${VERSION}]' section." >&2
            echo "Rename the [Unreleased] heading to [${VERSION}] before tagging." >&2
            exit 1
          fi

      - name: Publish to npm (Trusted Publishing via OIDC)
        run: npm publish --provenance --access public

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: /tmp/release-notes.txt
          generate_release_notes: false

  # Context7 indexing runs from this repo rather than from a workflow on
  # `release: published`. That trigger never fired: the release above is created
  # with the default GITHUB_TOKEN, and GitHub deliberately does not cascade
  # workflow triggers from GITHUB_TOKEN events. Measured — five releases, and
  # every context7 run in the repo's history was a manual workflow_dispatch. The
  # docs had only ever been refreshed by hand.
  #
  # A SEPARATE JOB, not a `continue-on-error` step inside `publish`. Both
  # constraints are real and they were being traded against each other: the
  # package is published and immutable by this point, so a docs-service outage
  # must not red the release — and a stale docs index is not optional either,
  # because the MCP server then serves the previous version's API to every agent
  # that asks. As a step with `continue-on-error`, the second constraint lost
  # silently: v0.23.0's run printed `Success: false / Status: 405` and the run
  # summary said green, which is the exact false green v0.23.0 exists to remove,
  # The release path's docs deploy — the other half of bug 0062 gap 4.
  #
  # `docs.yml` gates on "is this tree's version on npm", so a release merge (which lands
  # `docs/**` and a bumped `package.json` together) SKIPS there and lands here instead,
  # after the artifact exists. Without this job a release would deploy no docs at all,
  # which is a worse failure than the skew it replaces.
  #
  # `needs: publish` is the whole point: docs describing vX cannot go live before npm
  # serves vX. Measured before this existed — 32m54s of skew on v0.56.0, docs 12 minutes
  # ahead no matter how promptly the tag was pushed.
  #
  # It shares the `pages` concurrency group with `docs.yml` by name, so a docs-only push
  # racing a release cannot start two `deploy-pages` calls against one environment.
  deploy-docs:
    needs: publish
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run docs:build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs/.vitepress/dist
      - uses: actions/deploy-pages@v5

  # in the pipeline that shipped it. Splitting the job satisfies both — `publish`
  # stays green and keeps its release, `docs-index` reds on its own, and the run
  # is red so somebody acts.
  docs-index:
    needs: publish
    # The script's bounds are ~60s for the POST plus the poll budget; 10 minutes has
    # headroom now that the POST is no longer allowed 900s on its own.
    # The POST is bounded at 60s and the poll budget is the script's default 180s, so
    # 10 minutes is ample. The budget was briefly raised to 450s when a moved
    # `lastUpdateDate` was a hard requirement; it no longer is — an accepted refresh
    # that does not visibly re-crawl warns rather than fails, so polling longer only
    # delays the same warning. A budget still matters for the case that DOES fail:
    # `state != finalized` past the deadline, which means indexing genuinely started
    # and needs more time.
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Needed because `run:` executes a file from this repo — no action reads it
      # any more. It came free as a step inside `publish`, which checks out at the
      # top; a separate job starts empty.
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
            context7.json

      - name: Refresh the Context7 docs index
        env:
          CONTEXT7_API_KEY: ${{ secrets.CONTEXT7_API_KEY }}
          # Turns on the release-specific remedy: the publish already succeeded and
          # is immutable, so "re-run the publish job" is the wrong advice here.
          CONTEXT7_RELEASE_CONTEXT: '1'
        # `rennf93/upsert-context7@1.1` is gone from here on purpose. Measured
        # 2026-07-30: its `add` endpoint answers 405, and its `refresh` endpoint is
        # a page route that answers 200 with HTML — which the action reports as
        # success. The script checks the content type and then reads the index's
        # own timestamp back, so neither failure can present as green.
        run: .github/scripts/refresh-context7.sh
